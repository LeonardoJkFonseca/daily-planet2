<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envie seu curriculo</title>
</head>
<body>
    <header>
        <h1>Daily Planet</h1>
        <p>O maior jornal de Nova York</p>
    </header>
    <main>
        <form>
            <section>
            <h2>Informações para contato</h2>
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="name" placeholder="Digite seu nome...">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="Digite seu e-mail...">
            <label for="numero">Numero de telefone</label>
            <input type="number" name="numero" id="numero">
        </section>
        <section>
            <h2>Função desejada</h2>
            <label for="f1">Editor</label>
            <input type="radio" name="funcao" id="f1" value="editor"><br>
            <label for="f2">Jornalista</label>
            <input type="radio" name="funcao" id="f2" value="jornalista"><br>
            <label for="f3">Assessor de imprensa</label>
            <input type="radio" name="funcao" id="f3" value="assessor"><br>
            <label for="f4">Redator</label>
            <input type="radio" name="funcao" id="f4" value="redator"><br>
            <label for="f5">Âncora</label>
            <input type="radio" name="funcao" id="f5" value="ancora"><br>
            <label for="curriculo">Envie-nos seu curriculo</label>
            <input type="file" name="curriculo" id="curriculo">
        </section>
        <section>
            <h2>Você tem alguma deficiencia?</h2>
            <label for="sim">Sim</label>
            <input type="radio" name="simounao" id="sim">
            <label for="nao">Não</label>
            <input type="radio" name="simounao" id="nao">
            <h2>Se sim, qual/quais?</h2>
            <input type="checkbox" name="deficiencia-visual" id="deficiencia-visual">
            <label for="deficiencia-visual">Deficiencia Visual</label>
            <input type="checkbox" name="autismo" id="autismo">
            <label for="autismo">TEA (Transtorno do espectro autista)</label>
            <input type="checkbox" name="deficiencia-auditiva" id="deficiencia-auditiva">
            <label for="deficiencia-auditiva">Deficiencia Auditiva</label>
            <input type="checkbox" name="deficiencia-locomotiva" id="deficiencia-locomotiva">
            <label for="deficiencia-locomotiva">Deficiencia Locomotiva</label>
            <h2>Precisa de adaptações no ambiente de trabalho?</h2>
            <input type="radio" name="naoousim" id="nao" value="nao">
            <label for="nao">Não</label>
            <input type="radio" name="naoousim" id="sim" value="sim">
            <label for="sim">Sim</label>
        </section>
        <button onclick="alert ('CURRICULO ENVIADO')">ENVIAR CURRICULO</button>
        </form>
        <section>
            <h2><a href="equipe.html" target="_blank">Conheça nossa equipe atual e sinta-se em casa!</a></h2>
        </section>
    </main>
    <footer>
        <p>
            &copy; Daily Planet 2026. Todos os direitos reservados
        </p>
    </footer>
</body>
</html>
